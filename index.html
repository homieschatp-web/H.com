<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study with AI | Login</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
:root {
    --primary: #6366f1;
    --glass: rgba(255,255,255,0.85);
}
body {
    margin:0;
    font-family:'Inter',sans-serif;
    background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}
.container {
    background:var(--glass);
    backdrop-filter:blur(15px);
    width:400px;
    padding:40px;
    border-radius:24px;
    box-shadow:0 20px 40px rgba(0,0,0,0.2);
    text-align:center;
}
input {
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border-radius:10px;
    border:1px solid #ccc;
    outline:none;
}
input:focus { border-color:var(--primary); }
button {
    width:100%;
    padding:12px;
    background:var(--primary);
    color:white;
    border:none;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
}
.toggle {
    margin-top:15px;
    font-size:13px;
}
.toggle span {
    color:var(--primary);
    cursor:pointer;
    font-weight:600;
}
.hidden { display:none; }
</style>
</head>
<body>

<div class="container">

    <!-- LOGIN -->
    <div id="login-box">
        <h2>Welcome Back</h2>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="toggle">
            Don't have account? <span onclick="toggle()">Register</span>
        </div>
    </div>

    <!-- SIGNUP -->
    <div id="signup-box" class="hidden">
        <h2>Create Account</h2>
        <input type="text" id="signup-name" placeholder="Full Name">
        <input type="email" id="signup-email" placeholder="Email">
        <input type="password" id="signup-password" placeholder="Password">
        <button onclick="signup()">Register</button>
        <div class="toggle">
            Already have account? <span onclick="toggle()">Login</span>
        </div>
    </div>

</div>

<script>
/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyA1NTsIP0Rt0xR96aU-New2eGmLaDLSKXQ",
  authDomain: "onajjkj-c340e.firebaseapp.com",
  projectId: "onajjkj-c340e",
  storageBucket: "onajjkj-c340e.appspot.com",
  messagingSenderId: "588686832519",
  appId: "1:588686832519:web:f876e44c4c46756071d922"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* 🔥 Force persistent login */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

/* 🔥 If already logged in → go home */
auth.onAuthStateChanged(user=>{
    if(user){
        window.location.href="home.html";
    }
});

/* Toggle UI */
function toggle(){
    document.getElementById("login-box").classList.toggle("hidden");
    document.getElementById("signup-box").classList.toggle("hidden");
}

/* LOGIN */
function login(){
    const email=document.getElementById("login-email").value;
    const password=document.getElementById("login-password").value;

    auth.signInWithEmailAndPassword(email,password)
    .then(()=>{
        window.location.href="home.html";
    })
    .catch(err=>alert(err.message));
}

/* SIGNUP */
function signup(){
    const name=document.getElementById("signup-name").value;
    const email=document.getElementById("signup-email").value;
    const password=document.getElementById("signup-password").value;

    auth.createUserWithEmailAndPassword(email,password)
    .then(cred=>{
        return cred.user.updateProfile({
            displayName:name
        });
    })
    .then(()=>{
        // 🔥 Save user to Firestore (IMPORTANT for contacts)
        return db.collection("users").add({
            email: email
        });
    })
    .then(()=>{
        window.location.href="home.html";
    })
    .catch(err=>alert(err.message));
}
</script>

</body>
</html>
